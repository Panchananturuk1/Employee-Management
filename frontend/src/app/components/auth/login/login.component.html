<div class="auth-wrapper fade-in">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card auth-card">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="auth-icon mx-auto mb-3">
                <i class="fas fa-users-cog fa-2x"></i>
              </div>
              <h3 class="fw-bold mb-1">Welcome back</h3>
              <p class="text-muted mb-0">Sign in to manage your workforce</p>
            </div>

            <div class="alert alert-danger" *ngIf="errorMessage">
              <i class="fas fa-exclamation-circle me-2"></i>{{ errorMessage }}
            </div>

            <form #form="ngForm" (ngSubmit)="login()">
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                  <input type="email" class="form-control" id="email" name="email" placeholder="you@company.com"
                         [(ngModel)]="credentials.email" required email autocomplete="email">
                </div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-lock"></i></span>
                  <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="password" name="password"
                         placeholder="Your password" [(ngModel)]="credentials.password" required
                         autocomplete="current-password">
                  <button class="btn btn-outline-secondary" type="button" (click)="showPassword = !showPassword"
                          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                    <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                  </button>
                </div>
              </div>

              <div class="d-flex justify-content-end mb-4">
                <button type="button" class="btn btn-link p-0 small" (click)="sendPasswordReset()">
                  Forgot password?
                </button>
              </div>

              <button type="submit" class="btn btn-primary w-100" [disabled]="!form.valid || isSubmitting">
                <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
                <i class="fas fa-sign-in-alt me-2" *ngIf="!isSubmitting"></i>
                {{ isSubmitting ? 'Signing in...' : 'Sign In' }}
              </button>
            </form>

            <hr class="my-4">

            <p class="text-center text-muted mb-0">
              Don't have an account?
              <a routerLink="/signup" class="fw-semibold text-decoration-none">Create one</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
