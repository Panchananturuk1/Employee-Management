<div class="auth-wrapper fade-in">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="card auth-card">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="auth-icon mx-auto mb-3">
                <i class="fas fa-user-plus fa-2x"></i>
              </div>
              <h3 class="fw-bold mb-1">Create your account</h3>
              <p class="text-muted mb-0">Join Employee Hub in a few seconds</p>
            </div>

            <div class="alert alert-danger" *ngIf="errorMessage">
              <i class="fas fa-exclamation-circle me-2"></i>{{ errorMessage }}
            </div>

            <form #form="ngForm" (ngSubmit)="signUp()">
              <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-user"></i></span>
                  <input type="text" class="form-control" id="name" name="name" placeholder="Jane Cooper"
                         [(ngModel)]="signupRequest.name" required minlength="2" autocomplete="name">
                </div>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                  <input type="email" class="form-control" id="email" name="email" placeholder="you@company.com"
                         [(ngModel)]="signupRequest.email" required email autocomplete="email">
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label for="password" class="form-label">Password</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="password"
                           name="password" placeholder="At least 6 characters"
                           [(ngModel)]="signupRequest.password" required minlength="6" autocomplete="new-password">
                  </div>
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                  <label for="confirmPassword" class="form-label">Confirm Password</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="confirmPassword"
                           name="confirmPassword" placeholder="Repeat password"
                           [(ngModel)]="signupRequest.confirmPassword" required autocomplete="new-password">
                  </div>
                </div>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="showPasswordCheck" name="showPasswordCheck"
                       [(ngModel)]="showPassword">
                <label class="form-check-label small text-muted" for="showPasswordCheck">Show passwords</label>
              </div>

              <div class="alert alert-warning py-2 small"
                   *ngIf="signupRequest.confirmPassword && !passwordsMatch">
                <i class="fas fa-exclamation-triangle me-2"></i>The two passwords do not match.
              </div>

              <div class="mb-4">
                <label class="form-label">Account Type</label>
                <div class="role-options">
                  <label class="role-option" [class.selected]="signupRequest.role === 'user'">
                    <input type="radio" name="role" value="user" [(ngModel)]="signupRequest.role">
                    <i class="fas fa-eye mb-2"></i>
                    <span class="fw-semibold">Member</span>
                    <small class="text-muted">View employees and reports</small>
                  </label>
                  <label class="role-option" [class.selected]="signupRequest.role === 'admin'">
                    <input type="radio" name="role" value="admin" [(ngModel)]="signupRequest.role">
                    <i class="fas fa-user-shield mb-2"></i>
                    <span class="fw-semibold">Administrator</span>
                    <small class="text-muted">Add, edit and delete employees</small>
                  </label>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100"
                      [disabled]="!form.valid || !passwordsMatch || isSubmitting">
                <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
                <i class="fas fa-user-plus me-2" *ngIf="!isSubmitting"></i>
                {{ isSubmitting ? 'Creating account...' : 'Create Account' }}
              </button>
            </form>

            <hr class="my-4">

            <p class="text-center text-muted mb-0">
              Already have an account?
              <a routerLink="/login" class="fw-semibold text-decoration-none">Sign in</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
